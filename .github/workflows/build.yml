name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - fix-ios-transition-pause-target

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'TheSillyDoggo/bindings'
          # Pin to the revision used by the last successful platform matrix.
          # Following the moving main branch now breaks CheckpointFix against PlayerObject.
          bindings-ref: 257e09bff1f86c34ac06614dc9e39a120c78c074
          build-config: 'Release'
          export-pdb: true
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
