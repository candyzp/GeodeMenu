name: Apply Frame UI Fixes

on:
  push:
    branches:
      - frame-timing-debugger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary frame UI patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frame-timing-debugger
          fetch-depth: 0

      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('src/Client/Module.cpp')
          text = module.read_text()
          old = '''std::string Module::getName()\n{\n    return LocalisationManager::get()->getLocalisedString(fmt::format("names/{}", getID()));\n}\n'''
          new = '''std::string Module::getName()\n{\n    auto key = fmt::format("names/{}", getID());\n    auto localised = LocalisationManager::get()->getLocalisedString(key);\n\n    if (localised == fmt::format("<ttf>{}", key))\n        return name.empty() ? getID() : name;\n\n    return localised;\n}\n'''
          assert old in text, 'Module::getName target not found'
          text = text.replace(old, new, 1)

          old = '''std::string Module::getDescription()\n{\n    return LocalisationManager::get()->getLocalisedString(fmt::format("descriptions/{}", getID()));\n}\n'''
          new = '''std::string Module::getDescription()\n{\n    auto key = fmt::format("descriptions/{}", getID());\n    auto localised = LocalisationManager::get()->getLocalisedString(key);\n\n    if (localised == fmt::format("<ttf>{}", key))\n        return description;\n\n    return localised;\n}\n'''
          assert old in text, 'Module::getDescription target not found'
          text = text.replace(old, new, 1)
          module.write_text(text)

          fx = Path('src/Hacks/Universal/FrameExtrapolation.cpp')
          text = fx.read_text()

          replacements = {
              'setName("Extrapolation Method");': 'setName("Method");',
              'setDescription("Selects one of five fundamentally different visual smoothing strategies used whenever Frame Extrapolation is enabled.");': 'setDescription("Choose how frames are smoothed. Classic predicts motion, Camera Sync keeps camera/player motion together, Snapshot blends real states, Spring softly follows motion, and Tracker estimates corrected motion.");',
              '{(int)FrameExtrapolationMethod::LegacyLinear, "Legacy Linear"},': '{(int)FrameExtrapolationMethod::LegacyLinear, "Classic"},',
              '{(int)FrameExtrapolationMethod::CameraRelative, "Camera Relative"},': '{(int)FrameExtrapolationMethod::CameraRelative, "Camera Sync"},',
              '{(int)FrameExtrapolationMethod::SnapshotInterpolation, "Snapshot Interpolation"},': '{(int)FrameExtrapolationMethod::SnapshotInterpolation, "Snapshot"},',
              '{(int)FrameExtrapolationMethod::SpringFilter, "Spring Filter"},': '{(int)FrameExtrapolationMethod::SpringFilter, "Spring"},',
              '{(int)FrameExtrapolationMethod::AlphaBetaTracker, "Alpha-Beta Tracker"},': '{(int)FrameExtrapolationMethod::AlphaBetaTracker, "Tracker"},',
              'setName("Frame Timing Debugger");': 'setName("Debugger");',
              'setName("Show Timing Overlay");': 'setName("Show Stats");',
              'setName("Log Spikes Only");': 'setName("Spike Logs");',
              'setName("Spike Threshold");': 'setName("Spike Limit");',
              'case FrameExtrapolationMethod::LegacyLinear: return "Legacy Linear";': 'case FrameExtrapolationMethod::LegacyLinear: return "Classic";',
              'case FrameExtrapolationMethod::CameraRelative: return "Camera Relative";': 'case FrameExtrapolationMethod::CameraRelative: return "Camera Sync";',
              'case FrameExtrapolationMethod::SnapshotInterpolation: return "Snapshot Interpolation";': 'case FrameExtrapolationMethod::SnapshotInterpolation: return "Snapshot";',
              'case FrameExtrapolationMethod::SpringFilter: return "Spring Filter";': 'case FrameExtrapolationMethod::SpringFilter: return "Spring";',
              'case FrameExtrapolationMethod::AlphaBetaTracker: return "Alpha-Beta Tracker";': 'case FrameExtrapolationMethod::AlphaBetaTracker: return "Tracker";',
          }
          for old, new in replacements.items():
              assert old in text, f'FrameExtrapolation replacement not found: {old}'
              text = text.replace(old, new, 1)

          marker = '''        g_frameTiming.renderDtMs = g_presentDtSeconds * 1000.0f;\n        ++g_frameTiming.presentIndex;\n'''
          replacement = '''        // Read the selector directly every presented frame. The previous\n        // debugger only updated this value after an effect successfully applied,\n        // which made the overlay lie and stay on Classic when Blend was 0.\n        g_frameTiming.activeMethod = std::clamp(FrameExtrapolationMethodOption::get()->getValue(), 0, 4);\n\n        g_frameTiming.renderDtMs = g_presentDtSeconds * 1000.0f;\n        ++g_frameTiming.presentIndex;\n'''
          assert marker in text, 'Debugger live-method insertion point not found'
          text = text.replace(marker, replacement, 1)

          old_overlay = '''            "Method: {}\\nFrame: {:.2f} ms\\nGD updates: {}\\ngetModifiedDelta: {}\\nPhysics dt: {:.3f} ms\\nInterp: {:.3f}\\nFX offset: {:.3f}\\nPlayer d: {:.3f}\\nCamera d: {:.3f}",'''
          new_overlay = '''            "METHOD: {}\\nFRAME: {:.2f} ms\\nUPDATES: {}\\nPHYSICS CALLS: {}\\nPHYSICS DT: {:.3f} ms\\nBLEND: {:.3f}\\nEFFECT: {:.3f}\\nPLAYER MOVE: {:.3f}\\nCAMERA MOVE: {:.3f}",'''
          assert old_overlay in text, 'Overlay text target not found'
          text = text.replace(old_overlay, new_overlay, 1)

          fx.write_text(text)
          PY

      - name: Commit fixes and remove patcher
        run: |
          git config user.name "candyzp"
          git config user.email "166943815+candyzp@users.noreply.github.com"
          git rm .github/workflows/apply-frame-ui-fixes.yml
          git add src/Client/Module.cpp src/Hacks/Universal/FrameExtrapolation.cpp
          git commit -m "Fix Frame Extrapolation UI and live debugger method"
          git push origin HEAD:frame-timing-debugger
