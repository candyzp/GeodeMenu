name: Fix Blur And Portals

on:
  push:
    branches:
      - frame-timing-debugger
    paths:
      - '.github/workflows/fix-blur-portals.yml'

jobs:
  patch-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Apply focused blur and portal fixes
        run: python3 .github/scripts/fix_blur_portals.py

      - name: Verify focused source changes
        run: |
          grep -q 'class CameraBlurOverlay' src/Hacks/Universal/FrameExtrapolation.cpp
          grep -q 'portalStateChanged' src/Hacks/Universal/FrameExtrapolation.cpp
          grep -q 'CCPoint finalCamera = visualCamera;' src/Hacks/Universal/FrameExtrapolation.cpp

      - name: Build iOS mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'TheSillyDoggo/bindings'
          build-config: 'Release'
          target: iOS

      - name: Upload fixed iOS build
        uses: actions/upload-artifact@v4
        with:
          name: GeodeMenu-iOS-BlurPortalFix
          path: output/*.geode
          if-no-files-found: error

      - name: Commit focused fixes and remove temporary files
        if: success()
        run: |
          rm -f .github/workflows/fix-blur-portals.yml
          rm -f .github/scripts/fix_blur_portals.py
          git config user.name 'candyzp'
          git config user.email '166943815+candyzp@users.noreply.github.com'
          git add src/Hacks/Universal/FrameExtrapolation.cpp .github/workflows/fix-blur-portals.yml .github/scripts/fix_blur_portals.py
          git commit -m 'Fix camera blur rendering and portal transitions'
          git push origin HEAD:frame-timing-debugger
